<title>Painel de Posts — @wesleyfrnco</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{ --accent:#1d9bf0; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#161616;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f2f2f2;padding:24px}
  .topbar{max-width:1100px;margin:0 auto 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .topbar input{flex:1;min-width:220px;padding:12px 14px;border-radius:10px;border:1px solid #333;background:#0d0d0d;color:#fff;font-size:14px}
  .topbar button{padding:12px 20px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:14px}
  .topbar button.alt{background:#2a2a2a}
  .hint{max-width:1100px;margin:0 auto 24px;color:#999;font-size:13px;line-height:1.5}
  .posts{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:48px}
  .post-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
  .post-head h3{font-size:15px;color:#bbb;font-weight:600}
  .post-head .actions{display:flex;gap:8px;flex-wrap:wrap}
  .post-head button{padding:8px 16px;border-radius:8px;border:none;font-weight:600;cursor:pointer;font-size:13px}
  .post-head .toggle{background:#2a2a2a;color:#fff}
  .post-head .dl{background:var(--accent);color:#fff}
  .cards-wrap{overflow-x:auto;padding-bottom:12px}
  .cards-row{display:flex;gap:16px}
  .card-scale{width:346px;height:432px;flex:0 0 auto}
  .card{width:1080px;height:1350px;position:relative;transform:scale(0.32);transform-origin:top left;display:flex;flex-direction:column}
  .card-inner{padding:90px 80px;display:flex;flex-direction:column;height:100%}
  .card-header{display:flex;align-items:center;gap:24px;margin-bottom:60px}
  .card-header img{width:108px;height:108px;border-radius:50%;object-fit:cover}
  .names{display:flex;flex-direction:column;gap:4px}
  .name{font-size:34px;font-weight:700;display:flex;align-items:center;gap:10px}
  .verified{width:30px;height:30px}
  .handle{font-size:30px}
  .card-counter{position:absolute;top:90px;right:80px;font-size:30px;font-weight:600}
  .card-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:38px}
  .card-body p{font-size:50px;line-height:1.4}
  .card-body.small p{font-size:44px}
  .card.dark{background:#0D1B2E}
  .card.dark .name{color:#F8FAFF}
  .card.dark .verified{fill:#00B4D8}
  .card.dark .handle{color:#48CAE4}
  .card.dark .card-counter{color:#8A9BB5}
  .card.dark .card-body p{color:#F8FAFF}
  .card.light{background:#F8FAFF}
  .card.light .name{color:#0D1B2E}
  .card.light .verified{fill:#00B4D8}
  .card.light .handle{color:#00B4D8}
  .card.light .card-counter{color:#8A9BB5}
  .card.light .card-body p{color:#0D1B2E}
  .legenda-box{margin-top:16px;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:12px;padding:18px 20px}
  .legenda-box .lhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .legenda-box .ltit{font-size:13px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .legenda-box .copy{padding:6px 14px;border-radius:7px;border:none;background:#2a2a2a;color:#fff;font-size:12px;font-weight:600;cursor:pointer}
  .legenda-box .copy.done{background:#1d9b50}
  .legenda-box .ltxt{font-size:14px;line-height:1.6;color:#d8d8d8;white-space:pre-wrap}
</style>
</head>

function paragrafos(texto){
  const blocos = String(texto).split(/\n\s*\n|\n/).map(s=>s.trim()).filter(Boolean);
  return blocos.map(b=>`<p>${escapeHtml(b)}</p>`).join("");
}

function cardHTML(texto, idx, total, tema){
  const small = texto.length > 240 ? "small" : "";
  return `<div class="card-scale"><div class="card ${tema}">
    <div class="card-counter">${idx}/${total}</div>
    <div class="card-inner">
      <div class="card-header">
        <img src="${AVATAR}">
        <div class="names">
          <div class="name">wesleyfrnco ${VERIFIED}</div>
          <div class="handle">@wesleyfrnco</div>
        </div>
      </div>
      <div class="card-body ${small}">${paragrafos(texto)}</div>
    </div>
  </div></div>`;
}

function render(posts){
  const c = document.getElementById("posts");
  c.innerHTML = "";
  posts.forEach((post, pi)=>{
    const cards = post.cards;
    legendas[pi] = post.legenda || "";
    if(temas[pi]===undefined) temas[pi]="dark";
    const tema = temas[pi];
    const g = document.createElement("div");
    let cardsHTML = cards.map((t,i)=>cardHTML(t, i+1, cards.length, tema)).join("");
    let legendaHTML = "";
    if(legendas[pi]){
      legendaHTML = `<div class="legenda-box">
        <div class="lhead"><span class="ltit">Legenda</span>
        <button class="copy" onclick="copiar(${pi}, this)">Copiar legenda</button></div>
        <div class="ltxt">${escapeHtml(legendas[pi])}</div>
      </div>`;
    }
    g.innerHTML = `<div class="post-head"><h3>Post ${pi+1}</h3>
      <div class="actions">
        <button class="toggle" onclick="alternar(${pi})">Alternar estilo</button>
        <button class="dl" onclick="baixar(${pi})">Baixar carrossel (${cards.length} PNGs)</button>
      </div></div>
      <div class="cards-wrap"><div class="cards-row" id="group-${pi}">${cardsHTML}</div></div>
      ${legendaHTML}`;
    c.appendChild(g);
  });
  window._posts = posts;
}

function copiar(pi, btn){
  navigator.clipboard.writeText(legendas[pi]).then(()=>{
    btn.textContent = "Copiado!";
    btn.classList.add("done");
    setTimeout(()=>{ btn.textContent="Copiar legenda"; btn.classList.remove("done"); }, 1800);
  });
}

function alternar(pi){
  temas[pi] = (temas[pi]==="dark") ? "light" : "dark";
  const group = document.getElementById("group-"+pi);
  group.querySelectorAll(".card").forEach(card=>{
    card.classList.remove("dark","light");
    card.classList.add(temas[pi]);
  });
}

async function baixar(pi){
  const group = document.getElementById("group-"+pi);
  const cards = group.querySelectorAll(".card");
  const bg = temas[pi]==="dark" ? "#0D1B2E" : "#F8FAFF";
  for(let i=0;i<cards.length;i++){
    const el = cards[i];
    const prev = el.style.transform;
    el.style.transform = "none";
    const canvas = await html2canvas(el, {width:1080,height:1350,scale:1,backgroundColor:bg});
    el.style.transform = prev;
    const a = document.createElement("a");
    a.download = `wesleyfrnco_post${pi+1}_${temas[pi]}_card${i+1}.png`;
    a.href = canvas.toDataURL("image/png");
    a.click();
    await new Promise(r=>setTimeout(r,400));
  }
}

async function carregar(){
  const id = document.getElementById("sheetId").value.trim() || SHEET_ID;
  const url = `https://docs.google.com/spreadsheets/d/${id}/export?format=csv&sheet=${SHEET_NAME}`;
  try{
    const r = await fetch(url);
    const csv = await r.text();
    const rows = parseCSV(csv);
    if(rows.length < 2){ carregarDemo(); return; }
    const header = rows[0].map(h=>(h||"").toLowerCase());
    const iAprov = header.findIndex(c=>c.includes("aprov"));
    const iStatus = header.findIndex(c=>c.includes("status"));
    const iCards = header.findIndex(c=>c.includes("cards"));
    const iLeg = header.findIndex(c=>c.includes("legenda"));
    const posts = [];
    for(let i=1;i<rows.length;i++){
      const row = rows[i];
      const cell = idx => (idx>=0 && row[idx]!=null) ? row[idx].trim() : "";
      if(cell(iAprov).toLowerCase()==="aprovado" && cell(iStatus).toLowerCase()==="gerado"){
        const raw = cell(iCards);
        if(!raw) continue;
        let arr;
        try{ arr = JSON.parse(raw); }
        catch(e){
          const inner = raw.replace(/^\[|\]$/g,"");
          const parts = inner.split(".,");
          if(parts.length>=2){
            arr = parts.map((s,j)=>j<parts.length-1?s.trim()+".":s.trim()).filter(Boolean);
          } else { arr=[raw]; }
        }
        if(Array.isArray(arr)&&arr.length>0) posts.push({cards:arr,legenda:cell(iLeg)});
      }
    }
    if(posts.length===0){ carregarDemo(); return; }
    render(posts);
  }catch(e){ console.error(e); carregarDemo(); }
}

function parseCSV(text){
  const rows=[];
  let row=[], field="", inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i], nx=text[i+1];
    if(inQ){
      if(ch==='"'&&nx==='"'){field+='"';i++;}
      else if(ch==='"'){inQ=false;}
      else{field+=ch;}
    } else {
      if(ch==='"'){inQ=true;}
      else if(ch===','){row.push(field);field="";}
      else if(ch==='\r'&&nx==='\n'){row.push(field);rows.push(row);row=[];field="";i++;}
      else if(ch==='\n'||ch==='\r'){row.push(field);rows.push(row);row=[];field="";}
      else{field+=ch;}
    }
  }
  if(field||row.length){row.push(field);rows.push(row);}
  return rows;
}
// Carrega automaticamente ao abrir
document.getElementById("sheetId").value = SHEET_ID;
carregar();
